<path d="M92 424C98 384 150 358 200 360" stroke="#555a66" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".7" transform="translate(0,-2)"/>
<path d="M308 424C312 440 318 446 322 452" stroke="#1f2127" stroke-width="6" fill="none" stroke-linecap="round"/>
<circle cx="324" cy="470" r="18" fill="#b9c0c8"/><circle cx="324" cy="470" r="13" fill="#eef1f4" stroke="#8b939c" stroke-width="2"/><circle cx="324" cy="470" r="5" fill="#a8b0b9"/>
