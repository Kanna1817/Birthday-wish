<path d="M130 190C126 215 132 240 148 258" stroke="#8a7aa5" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
<path d="M170 268C164 290 168 316 158 332M230 268C236 290 232 316 242 332" stroke="#2b2234" stroke-width="7" fill="none" stroke-linecap="round"/>
