<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
<style>.bf{animation:fl 5s ease-in-out infinite}.bf2{animation:fl 6.5s ease-in-out infinite reverse}.tw path{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tw path:nth-child(2){animation-delay:.8s}.tw path:nth-child(3){animation-delay:1.5s}@keyframes fl{50%{transform:translateY(-10px)}}@keyframes tw{50%{opacity:.2;transform:scale(.6)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf0"/><stop offset=".55" stop-color="#f6f4e9"/><stop offset="1" stop-color="#e9efe3"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3e9ec"/><stop offset=".35" stop-color="#fdfdfb"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#dfe6ea"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3d5e"/><stop offset=".5" stop-color="#2b2234"/><stop offset="1" stop-color="#1c1626"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="bal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d6e4d3"/><stop offset="1" stop-color="#8fae94"/></radialGradient>
</defs>
<rect width="400" height="500" fill="url(#sky)"/>
<circle cx="200" cy="190" r="190" fill="url(#glow)"/>
<g stroke="#fff" stroke-width="6" opacity=".7"><path d="M70 0v260M200 0v220M330 0v260M0 120h400"/></g>
<g class="bf"><ellipse cx="62" cy="120" rx="30" ry="37" fill="url(#bal)"/><path d="M62 157c-4 30 6 50-4 80" stroke="#9db3a0" fill="none"/>
</g><g class="bf2"><ellipse cx="342" cy="96" rx="25" ry="31" fill="#f7f4ec" stroke="#e5e0d2"/><path d="M342 127c4 30-6 56 4 90" stroke="#b9c3b4" fill="none"/>
<ellipse cx="318" cy="150" rx="20" ry="25" fill="url(#bal)" opacity=".85"/></g>
<g class="tw" fill="#c9a96a" opacity=".85"><path d="M40 60l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><path d="M360 200l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M95 230l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g>
